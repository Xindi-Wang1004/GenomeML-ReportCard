name: genome-ml-reportcard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate split-fail toy manifests
        run: python tests/make_split_demo_data.py
      - name: Smoke tests
        run: python tests/test_smoke.py
      - name: Adoption demo (pass vs split-fail contract)
        run: python tests/test_adoption_demo.py
      - name: Build sdist/wheel
        run: pip install build && python -m build
